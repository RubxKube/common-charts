  #   kind: Secret
  #   metadata:
  #     name: example-secret
  #     labels: {}
  #   type: Opaque
  #   stringData:
  #     username: admin
  #     password: mypassword

tests:
  classicHttp: # default helm test method
    enabled: false
  curlHostHeader: # curl using ingress.hostName as Host in header
    enabled: false
    path: ""
