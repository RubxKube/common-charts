{{ if .Values.variables.secret.data }}
{{- $dot := . }}
{{- range $index, $value := .Values.variables.secret.data }}
{{- $secretName := printf "%s-%s" $dot.Values.name ($index | lower | replace "_" "-") }}
{{- $val := $value }}
{{- if empty $val }}
{{-   $existing := lookup "v1" "Secret" $dot.Release.Namespace $secretName }}
{{-   if and $existing (index $existing.data "secret") }}
{{-     $val = (index $existing.data "secret") | b64dec }}
{{-   else }}
{{-     $val = randAlphaNum 48 }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
data:
  secret: {{ $val | toString | b64enc }}
---
{{- end }}
{{- end }}
